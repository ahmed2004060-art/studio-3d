<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Studio 3D</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Segoe UI',system-ui,sans-serif;background:#0a0a0f;color:#e8e8f0;min-height:100vh;display:flex;flex-direction:column;align-items:center}
header{width:100%;padding:24px 40px;border-bottom:1px solid #1e1e2e;display:flex;align-items:center;gap:12px}
.logo{width:36px;height:36px;background:linear-gradient(135deg,#6c63ff,#a78bfa);border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:18px}
header h1{font-size:20px;font-weight:600}
.main{width:100%;max-width:800px;padding:48px 24px;display:flex;flex-direction:column;gap:28px}
.upload-zone{border:2px dashed #2a2a3e;border-radius:20px;padding:60px 24px;text-align:center;cursor:pointer;transition:all .2s;position:relative}
.upload-zone:hover{border-color:#6c63ff;background:#0f0f1a}
.upload-zone input{position:absolute;inset:0;opacity:0;cursor:pointer;width:100%}
.upload-icon{width:64px;height:64px;margin:0 auto 20px;background:#1a1730;border-radius:16px;display:flex;align-items:center;justify-content:center;font-size:28px}
.upload-zone h2{font-size:18px;font-weight:500;margin-bottom:8px}
.upload-zone p{font-size:14px;color:#6b6b8a}
.preview{display:none;gap:20px;align-items:flex-start}
.preview.show{display:flex}
.preview img{width:200px;height:200px;object-fit:cover;border-radius:14px;border:1px solid #1e1e2e}
.info{flex:1;display:flex;flex-direction:column;gap:12px}
.fname{font-weight:500;font-size:15px}
.fsize{font-size:13px;color:#6b6b8a}
.btn{width:100%;padding:14px;background:linear-gradient(135deg,#6c63ff,#a78bfa);border:none;border-radius:12px;color:#fff;font-size:15px;font-weight:600;cursor:pointer}
.btn:hover{opacity:.9}
.note{background:#0f1a10;border:1px solid #1e3a20;border-radius:12px;padding:14px;font-size:13px;color:#4ade80}
</style>
</head>
<body>
<header><div class="logo">✦</div><h1>Studio 3D</h1></header>
<div class="main">
<div class="upload-zone" id="uz">
  <input type="file" accept="image/*" onchange="handleFile(this.files[0])">
  <div class="upload-icon">🖼️</div>
  <h2>ارفع صورتك هنا</h2>
  <p>PNG · JPG · WEBP</p>
</div>
<div class="preview" id="pv">
  <img id="pi" src="" alt="">
  <div class="info">
    <div class="fname" id="fn"></div>
    <div class="fsize" id="fs"></div>
    <button class="btn" onclick="go()">ابدأ التوليد ✦</button>
  </div>
</div>
<div class="note">✅ مجاني 100% — GitHub Actions + TripoSR مفتوح المصدر</div>
</div>
<script>
let file;
function handleFile(f){
  if(!f||!f.type.startsWith('image/'))return;
  file=f;
  const r=new FileReader();
  r.onload=e=>{
    document.getElementById('pi').src=e.target.result;
    document.getElementById('fn').textContent=f.name;
    document.getElementById('fs').textContent=(f.size/1024).toFixed(1)+' KB';
    document.getElementById('pv').classList.add('show');
  };
  r.readAsDataURL(f);
}
function go(){
  if(!file)return;
  window.open('https://github.com/ahmed2004060-art/studio-3d/issues/new?title=3D+Generation&body=ارفع+الصورة+هنا+كمرفق','_blank');
}
</script>
</body></html>
